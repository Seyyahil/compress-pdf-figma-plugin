name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run verify
      - run: npm run check:distribution
      - name: Require committed bundles to match source
        run: /usr/bin/git diff --exit-code -- dist
